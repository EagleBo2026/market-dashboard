<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五席AI策略 · 实时市场仪表盘</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0e14; color:#c9d1d9; font-family:'Microsoft YaHei','PingFang SC',-apple-system,sans-serif; min-height:100vh; }
  .header { background:#111a28; border-bottom:2px solid #58a6ff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .header h1 { font-size:20px; color:#f0f6fc; }
  .header h1 span { color:#58a6ff; }
  .status { display:flex; align-items:center; gap:10px; font-size:12px; color:#8b949e; }
  .dot { width:8px; height:8px; border-radius:50%; background:#3fb950; animation:pulse 2s infinite; }
  .dot.error { background:#ff7b72; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .container { max-width:1200px; margin:0 auto; padding:16px; }
  
  .ticker { display:flex; gap:1px; background:#161b22; border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .ticker-item { flex:1; text-align:center; padding:12px 6px; background:#0d1117; min-width:0; }
  .ticker-item .name { font-size:11px; color:#8b949e; margin-bottom:5px; white-space:nowrap; }
  .ticker-item .val { font-size:16px; font-weight:bold; color:#f0f6fc; font-family:Consolas,monospace; white-space:nowrap; }
  .ticker-item .chg { font-size:12px; margin-top:3px; }
  .up { color:#3fb950; }
  .down { color:#ff7b72; }
  .loading-text { color:#6e7681; font-style:italic; }
  
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
  .card { background:#161b22; border:1px solid #21262d; border-radius:10px; padding:18px; }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .card-header h3 { font-size:15px; color:#f0f6fc; }
  .card-badge { font-size:10px; padding:2px 8px; border-radius:10px; background:#1a2332; color:#58a6ff; }
  .card-badge.live { color:#3fb950; }
  
  .row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #21262d; }
  .row:last-child { border-bottom:none; }
  .row .label { font-size:13px; color:#8b949e; }
  .row .val { font-size:15px; font-weight:bold; color:#f0f6fc; font-family:Consolas,monospace; }
  .row .val small { font-size:12px; font-weight:normal; }
  
  .heatmap { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .heat-item { background:#0d1117; border-radius:8px; padding:12px 8px; text-align:center; }
  .heat-item .sector { font-size:12px; color:#8b949e; margin-bottom:5px; }
  .heat-item .pct { font-size:18px; font-weight:bold; font-family:Consolas,monospace; }
  
  .news { grid-column:1/-1; }
  .news-item { padding:11px 0; border-bottom:1px solid #21262d; display:flex; gap:10px; align-items:flex-start; }
  .news-item:last-child { border-bottom:none; }
  .news-dot { width:6px; height:6px; border-radius:50%; background:#58a6ff; margin-top:7px; flex-shrink:0; }
  .news-item .n-title { font-size:13px; color:#f0f6fc; margin-bottom:3px; line-height:1.4; }
  .news-item .n-meta { font-size:11px; color:#484f58; }
  
  .footer { text-align:center; padding:24px; font-size:11px; color:#484f58; border-top:1px solid #21262d; margin-top:20px; }
  .footer a { color:#58a6ff; text-decoration:none; }
  
  .refresh-bar { margin-bottom:14px; background:#161b22; border-radius:6px; height:3px; overflow:hidden; }
  .refresh-progress { height:100%; background:linear-gradient(90deg,#58a6ff,#3fb950); border-radius:6px; transition:width 1s linear; }
  
  .api-status { font-size:10px; padding:1px 6px; border-radius:8px; margin-left:6px; }
  .api-status.ok { background:#1a3a2a; color:#3fb950; }
  .api-status.err { background:#3a1a1a; color:#ff7b72; }

  @media(max-width:768px) {
    .header h1 { font-size:17px; }
    .ticker { flex-wrap:wrap; }
    .ticker-item { flex:0 0 33.33%; padding:10px 4px; }
    .ticker-item .val { font-size:14px; }
    .grid { grid-template-columns:1fr; }
    .heatmap { grid-template-columns:repeat(2,1fr); }
    .container { padding:10px; }
    .card { padding:14px; }
  }
  @media(max-width:400px) {
    .ticker-item { flex:0 0 50%; }
    .heatmap { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="header">
  <h1><span>五席AI策略</span> · 实时市场仪表盘</h1>
  <div class="status">
    <span id="apiBadge" class="api-status ok">API</span>
    <div class="dot" id="statusDot"></div>
    <span id="updateTime">更新中...</span>
  </div>
</div>
<div class="container">
  <div class="refresh-bar"><div class="refresh-progress" id="progress" style="width:0%"></div></div>
  
  <div class="ticker" id="ticker"></div>
  
  <div class="grid">
    <div class="card">
      <div class="card-header"><h3>富时中国 A50</h3><span class="card-badge live">实时</span></div>
      <div class="row"><span class="label">最新点位</span><span class="val" id="a50Price">--</span></div>
      <div class="row"><span class="label">涨跌额</span><span class="val" id="a50Change">--</span></div>
      <div class="row"><span class="label">涨跌幅</span><span class="val" id="a50Pct">--</span></div>
      <div class="row"><span class="label">年内表现</span><span class="val" id="a50Ytd">--</span></div>
      <div class="row"><span class="label">离岸人民币</span><span class="val" id="usdcnh">--</span></div>
    </div>
    
    <div class="card">
      <div class="card-header"><h3>商品期货</h3><span class="card-badge live">实时</span></div>
      <div id="commodity"></div>
    </div>
    
    <div class="card">
      <div class="card-header"><h3>标普500 行业</h3><span class="card-badge">ETF代理</span></div>
      <div class="heatmap" id="heatmap"></div>
    </div>
    
    <div class="card">
      <div class="card-header"><h3>大类资产</h3><span class="card-badge live">实时</span></div>
      <div id="asset"></div>
    </div>
    
    <div class="card news">
      <div class="card-header"><h3>市场要闻</h3><span class="card-badge" id="newsDate">--</span></div>
      <div id="newsList"></div>
    </div>
  </div>
</div>
<div class="footer">
  五席AI策略 · 实时市场仪表盘 | 数据：Yahoo Finance / 新浪财经 | 仅供参考，不构成投资建议
</div>

<script>
// ====== 配置 ======
const CONFIG = {
  REFRESH_SEC: 60,
  CORS_PROXIES: [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
  ],
  proxyIdx: 0,
  YF_BASE: 'https://query1.finance.yahoo.com/v8/finance/chart/',
};

// ====== 静态兜底数据 ======
const FALLBACK = {
  tickers: [
    {name:"标普500", val:"5,872.34", chg:"-2.60%", up:false},
    {name:"纳斯达克", val:"18,904.21", chg:"-4.70%", up:false},
    {name:"道指", val:"42,315.08", chg:"-1.20%", up:false},
    {name:"美元指数", val:"100.08", chg:"+0.80%", up:false},
    {name:"VIX", val:"26.40", chg:"+15.30%", up:false},
    {name:"10Y美债", val:"4.55%", chg:"+10bp", up:false},
  ],
  a50: {price:"16,103.77", change:"+73.92", pct:"+0.46%", ytd:"+5.20%"},
  commodities: [
    {name:"WTI原油", val:"90.50", chg:"+3.60%", up:true},
    {name:"布伦特原油", val:"93.10", chg:"+1.10%", up:true},
    {name:"COMEX黄金", val:"4,319.1", chg:"-4.90%", up:false},
    {name:"COMEX白银", val:"69.20", chg:"-7.90%", up:false},
    {name:"LME铜", val:"13,762", chg:"+0.80%", up:true},
    {name:"玉米", val:"465.50", chg:"+0.32%", up:true},
    {name:"小麦", val:"592.25", chg:"-1.04%", up:false},
    {name:"美稻谷", val:"13.100", chg:"-0.68%", up:false},
  ],
  sectors: [
    {name:"能源", pct:"+2.5%", up:true},
    {name:"医疗", pct:"+2.3%", up:true},
    {name:"房地产", pct:"+1.5%", up:true},
    {name:"信息技术", pct:"-5.4%", up:false},
    {name:"可选消费", pct:"-6.2%", up:false},
    {name:"通讯服务", pct:"-3.9%", up:false},
  ],
  assets: [
    {name:"WTI原油", val:"90.50", chg:"+3.6%", up:true},
    {name:"布伦特原油", val:"93.10", chg:"+1.1%", up:true},
    {name:"COMEX黄金", val:"4,319.1", chg:"-4.9%", up:false},
    {name:"COMEX白银", val:"69.20", chg:"-7.9%", up:false},
    {name:"比特币", val:"90,911", chg:"-1.6%", up:false},
  ],
  news: [
    {title:"SpaceX 750亿美元超级IPO", time:"6月12日"},
    {title:"非农大超预期 5月新增17.2万", time:"6月6日"},
    {title:"科技股重挫 纳指周跌4.7%", time:"6月6日"},
    {title:"美元破100关口 全球科技股回调", time:"6月5日"},
    {title:"苹果 WWDC 2026 下周召开", time:"6月8-12日"},
    {title:"本周焦点：美国5月CPI公布", time:"6月10日"},
  ],
};

// ====== 状态 ======
let apiOk = false;
let lastData = null;

// ====== Yahoo Finance 映射 ======
const YF_INDICES = [
  {sym:'^GSPC', name:'标普500'},
  {sym:'^IXIC', name:'纳斯达克'},
  {sym:'^DJI', name:'道指'},
  {sym:'DX-Y.NYB', name:'美元指数'},
  {sym:'^VIX', name:'VIX'},
  {sym:'^TNX', name:'10Y美债'},
];

const YF_COMMODITIES = [
  {sym:'CL=F', name:'WTI原油'},
  {sym:'BZ=F', name:'布伦特原油'},
  {sym:'GC=F', name:'COMEX黄金'},
  {sym:'SI=F', name:'COMEX白银'},
  {sym:'HG=F', name:'LME铜'},
  {sym:'ZC=F', name:'玉米'},
  {sym:'ZW=F', name:'小麦'},
  {sym:'ZR=F', name:'美稻谷'},
];

const YF_SECTORS = [
  {sym:'XLE', name:'能源'},
  {sym:'XLV', name:'医疗'},
  {sym:'XLRE', name:'房地产'},
  {sym:'XLK', name:'信息技术'},
  {sym:'XLY', name:'可选消费'},
  {sym:'XLC', name:'通讯服务'},
];

const YF_ASSETS = [
  {sym:'BTC-USD', name:'比特币'},
  {sym:'ETH-USD', name:'以太坊'},
  {sym:'CNH=X', name:'离岸人民币'},
];

// ====== 工具函数 ======
function fmt(n, dec=2) {
  if (n == null || isNaN(n)) return '--';
  return Number(n).toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}

function fmtChg(n, dec=2, suffix='%') {
  if (n == null || isNaN(n)) return '--';
  const sign = n >= 0 ? '+' : '';
  return sign + Number(n).toFixed(dec) + suffix;
}

function fmtPct(n) {
  return fmtChg(n, 2, '%');
}

function fmtBps(n) {
  // 10Y yield is already in %, display as-is
  return fmtChg(n, 2, '%');
}

// ====== API 获取 ======
async function fetchWithProxy(url, proxyIdx=0) {
  if (proxyIdx >= CONFIG.CORS_PROXIES.length) return null;
  const proxy = CONFIG.CORS_PROXIES[proxyIdx];
  try {
    const resp = await fetch(proxy + encodeURIComponent(url), {signal: AbortSignal.timeout(8000)});
    if (!resp.ok) throw new Error('proxy fail');
    return await resp.json();
  } catch(e) {
    return fetchWithProxy(url, proxyIdx + 1);
  }
}

async function fetchYFBatch(symbols) {
  // Yahoo Finance v7 quote API - single request for multiple symbols
  const symStr = symbols.map(s=>s.sym).join(',');
  const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symStr}&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,previousClose,shortName`;
  try {
    // Try direct first
    const resp = await fetch(url, {signal: AbortSignal.timeout(6000)});
    if (resp.ok) {
      const json = await resp.json();
      return json.quoteResponse?.result || [];
    }
  } catch(e) {}
  // Fallback to proxy
  try {
    const data = await fetchWithProxy(url);
    return data?.quoteResponse?.result || [];
  } catch(e) { return []; }
}

async function fetchYFChart(symbol) {
  const url = `${CONFIG.YF_BASE}${symbol}?interval=1d&range=2d`;
  try {
    const resp = await fetch(url, {signal: AbortSignal.timeout(5000)});
    if (resp.ok) {
      const json = await resp.json();
      const meta = json.chart?.result?.[0]?.meta;
      if (meta) return { price: meta.regularMarketPrice, prev: meta.previousClose };
    }
  } catch(e) {}
  // Fallback proxy
  try {
    const data = await fetchWithProxy(url);
    const meta = data?.chart?.result?.[0]?.meta;
    if (meta) return { price: meta.regularMarketPrice, prev: meta.previousClose };
  } catch(e) {}
  return null;
}

async function fetchA50() {
  // Sina Finance A50 continuous futures
  const sinaUrl = 'http://hq.sinajs.cn/list=nf_CN00Y';
  try {
    const text = await fetchWithProxy(sinaUrl, 0);
    if (typeof text === 'string' && text.includes('=')) {
      // Parse: var hq_str_nf_CN00Y="name,price,change,..."
      const parts = text.split('"')[1]?.split(',');
      if (parts && parts.length > 3) {
        return {
          price: parseFloat(parts[1]),
          prev: parseFloat(parts[1]) - parseFloat(parts[2]),
          change: parseFloat(parts[2]),
          pct: parseFloat(parts[3]),
        };
      }
    }
  } catch(e) {}
  return null;
}

async function fetchNews() {
  // Try Finnhub if key is set, else use static
  // Free key registration: https://finnhub.io/register
  const FINNHUB_KEY = ''; // <<< 在此填入免费 Finnhub API Key
  if (FINNHUB_KEY) {
    try {
      const url = `https://finnhub.io/api/v1/news?category=general&token=${FINNHUB_KEY}`;
      const resp = await fetch(url, {signal: AbortSignal.timeout(6000)});
      if (resp.ok) {
        const news = await resp.json();
        return news.slice(0, 8).map(n=>({
          title: n.headline,
          time: new Date(n.datetime * 1000).toLocaleDateString('zh-CN'),
          url: n.url,
        }));
      }
    } catch(e) {}
  }
  // Try MarketAux free tier or RSS
  return null;
}

// ====== 数据处理 ======
function processQuote(result, name) {
  if (!result) return null;
  const price = result.regularMarketPrice;
  const change = result.regularMarketChange;
  const pct = result.regularMarketChangePercent;
  if (price == null) return null;
  return {
    name,
    price,
    change,
    pct,
    up: change >= 0,
  };
}

function processChart(meta, name) {
  if (!meta || meta.regularMarketPrice == null) return null;
  const price = meta.regularMarketPrice;
  const prev = meta.previousClose || meta.chartPreviousClose;
  const change = prev ? price - prev : 0;
  const pct = prev ? (change / prev) * 100 : 0;
  return { name, price, change, pct, up: change >= 0 };
}

// ====== 渲染 ======
function renderTicker(items) {
  document.getElementById('ticker').innerHTML = items.map(t=>{
    const cls = t.up ? 'up' : 'down';
    const val = t.name === '10Y美债' ? t.price.toFixed(2) + '%' : fmt(t.price, 2);
    const chg = t.name === '10Y美债'
      ? fmtBps(t.change * 100) + 'bp'
      : fmtPct(t.pct);
    return `<div class="ticker-item">
      <div class="name">${t.name}</div>
      <div class="val">${val}</div>
      <div class="chg ${cls}">${chg}</div>
    </div>`;
  }).join('');
}

function renderCommodity(items) {
  document.getElementById('commodity').innerHTML = items.map(c=>`
    <div class="row">
      <span class="label">${c.name}</span>
      <span class="val ${c.up?'up':'down'}">${fmt(c.price, c.price>100?1:3)} <small>${fmtPct(c.pct)}</small></span>
    </div>
  `).join('');
}

function renderHeatmap(items) {
  document.getElementById('heatmap').innerHTML = items.map(s=>`
    <div class="heat-item">
      <div class="sector">${s.name}</div>
      <div class="pct ${s.up?'up':'down'}">${fmtPct(s.pct)}</div>
    </div>
  `).join('');
}

function renderAssets(items) {
  document.getElementById('asset').innerHTML = items.map(a=>`
    <div class="row">
      <span class="label">${a.name}</span>
      <span class="val ${a.up?'up':'down'}">${fmt(a.price, a.price>10000?1:2)} <small>${fmtPct(a.pct)}</small></span>
    </div>
  `).join('');
}

function renderNews(items) {
  document.getElementById('newsList').innerHTML = items.map(n=>`
    <div class="news-item">
      <div class="news-dot"></div>
      <div>
        <div class="n-title">${n.url ? `<a href="${n.url}" target="_blank" style="color:#f0f6fc;text-decoration:none;">${n.title}</a>` : n.title}</div>
        <div class="n-meta">${n.time || ''}</div>
      </div>
    </div>
  `).join('');
}

function renderA50(data) {
  if (!data) {
    document.getElementById('a50Price').textContent = '--';
    document.getElementById('a50Change').textContent = '--';
    document.getElementById('a50Pct').textContent = '--';
    return;
  }
  document.getElementById('a50Price').textContent = fmt(data.price, 1);
  const chgEl = document.getElementById('a50Change');
  chgEl.textContent = fmtChg(data.change, 1, '');
  chgEl.className = 'val ' + (data.change>=0?'up':'down');
  const pctEl = document.getElementById('a50Pct');
  pctEl.textContent = fmtPct(data.pct);
  pctEl.className = 'val ' + (data.change>=0?'up':'down');
}

function setApiStatus(ok) {
  apiOk = ok;
  const badge = document.getElementById('apiBadge');
  const dot = document.getElementById('statusDot');
  if (ok) {
    badge.textContent = 'API OK';
    badge.className = 'api-status ok';
    dot.className = 'dot';
  } else {
    badge.textContent = 'API ERR';
    badge.className = 'api-status err';
    dot.className = 'dot error';
  }
}

// ====== 主刷新函数 ======
async function refreshAll() {
  let hasLiveData = false;

  // 1. 美股指数 (v7 batch)
  try {
    const results = await fetchYFBatch(YF_INDICES);
    if (results.length > 0) {
      const items = YF_INDICES.map(symDef => {
        const r = results.find(r => r.symbol === symDef.sym);
        return processQuote(r, symDef.name) || null;
      }).filter(Boolean);
      
      // Merge 10Y yield special handling: ^TNX gives yield*100 in price
      const tnx = items.find(i => i.name === '10Y美债');
      if (tnx) {
        tnx.price = tnx.price / 100; // Convert to actual %
        tnx.change = tnx.change / 100;
        tnx.pct = tnx.pct; // Keep as %
      }
      
      if (items.length >= 3) {
        lastData = { ...lastData, tickers: items };
        hasLiveData = true;
      }
    }
  } catch(e) { console.warn('Indices fetch failed:', e); }

  // 2. 商品期货
  try {
    const results = await fetchYFBatch(YF_COMMODITIES);
    if (results.length > 0) {
      const items = YF_COMMODITIES.map(symDef => {
        const r = results.find(r => r.symbol === symDef.sym);
        return processQuote(r, symDef.name) || null;
      }).filter(Boolean);
      if (items.length >= 3) {
        lastData = { ...lastData, commodities: items };
        hasLiveData = true;
      }
    }
  } catch(e) { console.warn('Commodities fetch failed:', e); }

  // 3. 行业 ETF
  try {
    const results = await fetchYFBatch(YF_SECTORS);
    if (results.length > 0) {
      const items = YF_SECTORS.map(symDef => {
        const r = results.find(r => r.symbol === symDef.sym);
        const q = processQuote(r, symDef.name);
        return q ? { name: q.name, pct: q.pct, up: q.up } : null;
      }).filter(Boolean);
      // Sort by abs pct, show top 6
      items.sort((a,b) => Math.abs(b.pct) - Math.abs(a.pct));
      if (items.length >= 3) {
        lastData = { ...lastData, sectors: items.slice(0, 6) };
      }
    }
  } catch(e) { console.warn('Sectors fetch failed:', e); }

  // 4. 大类资产 (比特币+以太坊+原油+黄金+白银 merged)
  try {
    const allAssets = [...YF_ASSETS, {sym:'CL=F',name:'WTI原油'},{sym:'GC=F',name:'COMEX黄金'},{sym:'SI=F',name:'COMEX白银'}];
    const results = await fetchYFBatch(allAssets);
    if (results.length > 0) {
      const items = allAssets.map(symDef => {
        const r = results.find(r => r.symbol === symDef.sym);
        return processQuote(r, symDef.name) || null;
      }).filter(Boolean);
      if (items.length >= 3) {
        lastData = { ...lastData, assets: items };
      }
    }
  } catch(e) { console.warn('Assets fetch failed:', e); }

  // 5. A50
  try {
    const a50 = await fetchA50();
    if (a50 && a50.price) {
      lastData = { ...lastData, a50 };
      hasLiveData = true;
    }
  } catch(e) { console.warn('A50 fetch failed:', e); }

  // 6. News
  try {
    const news = await fetchNews();
    if (news && news.length > 0) {
      lastData = { ...lastData, news };
    }
  } catch(e) { console.warn('News fetch failed:', e); }

  // 7. 离岸人民币
  document.getElementById('usdcnh').textContent = '--';
  document.getElementById('usdcnh').className = 'val';
  if (lastData?.assets) {
    const cnh = lastData.assets.find(a => a.name === '离岸人民币');
    if (cnh) {
      document.getElementById('usdcnh').textContent = fmt(cnh.price, 4);
    }
  }
  // YTD for A50 (approximate)
  document.getElementById('a50Ytd').textContent = '--';
  document.getElementById('a50Ytd').className = 'val';

  // Render with data or fallback
  setApiStatus(hasLiveData);

  const tickers = lastData?.tickers || FALLBACK.tickers;
  const commodities = lastData?.commodities || FALLBACK.commodities;
  const sectors = lastData?.sectors || FALLBACK.sectors;
  const assets = lastData?.assets || FALLBACK.assets;
  const news = lastData?.news || FALLBACK.news;
  const a50 = lastData?.a50;

  renderTicker(tickers);
  renderCommodity(commodities);
  renderHeatmap(sectors);
  renderAssets(assets);
  renderNews(news);
  renderA50(a50);
  
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('zh-CN');
  document.getElementById('newsDate').textContent = new Date().toLocaleDateString('zh-CN', {month:'short', day:'numeric'});
}

// ====== 倒计时 ======
let refreshSec = 0;
function updateProgress() {
  refreshSec++;
  let pct = Math.min((refreshSec / CONFIG.REFRESH_SEC) * 100, 100);
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('zh-CN');
  if (refreshSec >= CONFIG.REFRESH_SEC) {
    refreshSec = 0;
    refreshAll();
  }
}

// ====== 初始化 ======
document.getElementById('updateTime').textContent = '加载中...';
setApiStatus(false);

// Initial render with fallback
renderTicker(FALLBACK.tickers);
renderCommodity(FALLBACK.commodities);
renderHeatmap(FALLBACK.sectors);
renderAssets(FALLBACK.assets);
renderNews(FALLBACK.news);
renderA50(null);
document.getElementById('usdcnh').textContent = '--';

// Kick off first refresh
refreshAll().then(() => {
  document.getElementById('progress').style.width = '100%';
});

setInterval(updateProgress, 1000);
</script>
